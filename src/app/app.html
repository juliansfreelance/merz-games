  <!-- Marco kiosco vertical 9:16 -->
  <div class="relative w-full h-full aspect-[9/16] max-h-full max-w-full bg-neutral-950 overflow-hidden">

    <!-- Contenido de ruta activa -->

    <!-- Badge de versión discreto (solo referencia de desarrollo) -->

      v{{ appVersion() }}
    </span>

  </div>
</div>
