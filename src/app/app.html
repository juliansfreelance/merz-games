<!-- Contenedor externo: ocupa todo el viewport, fondo letterbox oscuro -->
<div class="fixed inset-0 flex items-center justify-center bg-neutral-950 overflow-hidden select-none">

  <!-- Marco principal de la aplicación con atmósfera y contenido adaptable -->
  <div class="relative w-full h-full min-h-0 overflow-hidden flex flex-col">

    <!-- Atmósfera de fondo viva (degradado flotante gobernado por catálogo) -->
    <app-floating-gradient [atmosphere]="currentAtmosphere()" />

    <!-- Contenido de ruta activa (capa interactiva que gestiona su scroll natural y sticky footer) -->
    <div class="relative z-10 w-full h-full min-h-0 flex flex-col overflow-hidden">
      <router-outlet />
    </div>

    <!-- Badge de versión discreto (solo referencia de desarrollo) -->
    <span class="absolute bottom-1 right-3 text-[10px] text-neutral-600 font-mono pointer-events-none z-50 select-none">
      v{{ appVersion() }}
    </span>

  </div>
</div>
